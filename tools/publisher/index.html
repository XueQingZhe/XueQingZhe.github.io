<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>笔记发布管理器 · 吟处雪轻遮</title>
<style>
:root{color-scheme:light;--bg:#f3f7f7;--paper:#fff;--ink:#213b49;--muted:#526974;--line:#d5e2e5;--accent:#176b80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{padding:28px 5%;border-bottom:1px solid var(--line);background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:25px;margin:0}p{margin:7px 0;color:var(--muted)}main{padding:26px 5%;max-width:1600px;margin:auto}.steps{display:flex;gap:22px;color:var(--muted);font-size:12px;margin-bottom:25px}.steps b{color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(400px,1.3fr);gap:24px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}h2{font-size:18px;margin:0 0 15px}h3{font-size:14px;margin:24px 0 8px}input,select,button{font:inherit}input[type=search],select{border:1px solid #a4bac3;border-radius:6px;padding:8px;background:white;color:var(--ink);max-width:100%}input[type=search]{width:100%;margin:12px 0}input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;flex:none}button{padding:8px 13px;border:1px solid #a4bac3;border-radius:6px;cursor:pointer;background:white;color:var(--ink)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5aa63;outline-offset:2px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.filters{display:flex;gap:10px;flex-wrap:wrap}.note{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:start;gap:10px}.note small,.asset small{display:block;color:var(--muted);overflow-wrap:anywhere;font-size:11px}.note strong{font-size:13px}.badge{font-size:10px;color:var(--accent);margin-left:8px}.notes{max-height:62vh;overflow:auto}.count{font-size:12px;color:var(--muted);margin:12px 0}.message{white-space:pre-wrap;padding:12px 15px;border-left:3px solid var(--accent);background:#e9f3f5;margin-bottom:20px;overflow-wrap:anywhere}.message.error{background:#fff0ed;border-color:#b54031}.asset{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:start}.asset>div{flex:1;min-width:0}.asset select{font-size:12px;margin-top:8px}.change{margin:5px 0;font-size:13px}.warning{color:#845a27}.error-text{color:#a1392c}.muted{color:var(--muted)}.empty{padding:36px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}pre{max-height:55vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;background:var(--bg);padding:15px}details{margin-top:15px}footer{font-size:11px;color:var(--muted);margin:25px 0}.summary{display:flex;gap:20px;margin:15px 0}.summary b{font-size:23px;display:block}.summary span{font-size:11px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.steps{flex-wrap:wrap}.notes{max-height:45vh}}
</style></head><body>
<header><div><p style="letter-spacing:3px;font-size:10px">LOCAL PUBLISHER / 只在本机运行</p><h1>笔记副本管理</h1><p>选择笔记，审核附件，更新本地网站。</p></div><button id="rescan">重新扫描</button></header>
<main><div class="steps"><b>01 选择笔记</b><span>02 审核内容与附件</span><span>03 生成副本</span><span>04 预览网站</span></div><div id="message" class="message" role="status" aria-live="polite">正在读取本地笔记目录…</div>
<div class="layout"><section class="panel"><h2>公开哪些笔记，由你决定</h2><div class="filters"><select id="folder" aria-label="筛选目录"><option value="">全部目录</option></select><label><input id="only" type="checkbox"> 只看已选择</label><label><input id="candidate" type="checkbox"> 只看发布候选</label></div><input id="search" type="search" placeholder="搜索标题或文件路径" aria-label="搜索笔记"><div class="filters"><button id="selectVisible">选择当前结果</button><button id="clearVisible">取消当前结果</button></div><p class="count" id="count"></p><div id="missing"></div><div class="notes" id="notes"></div><div class="actions"><button id="save">保存选择</button><button class="primary" id="analyze">分析本次副本</button></div><p style="font-size:11px">批量选择只包含当前结果，后续新文件不会自动选中。保存选择不会导出或上传。</p></section>
<section class="panel"><h2>本次变更与附件审核</h2><div id="review"><div class="empty">尚未分析本次副本。</div></div><div class="actions"><button id="prepare" class="primary" disabled>生成待预览副本</button><button id="apply" disabled>确认写入本地网站</button><a id="sitePreview" href="__PREVIEW_URL__" target="_blank" rel="noreferrer" style="align-self:center">打开网站预览</a></div><p style="font-size:11px">“写入本地网站”仅更新本机副本，包含已确认的撤回；不会提交 Git 或执行部署。</p><div id="staged" hidden><h3>正文副本检查</h3><select id="previewNote" aria-label="选择预览正文"></select><pre id="preview" tabindex="0"></pre></div></section></div>
<footer>私有笔记库 → 明确选择 → 附件审核 → 压缩副本 → 网站预览。上传与上线是后续独立操作。</footer></main>
<script>
const token='__TOKEN__', $=id=>document.getElementById(id);let notes=[],selected=new Set(),assetModes={},plan=null,stage=null,working=false,scanned=false,selectionDirty=false,ffmpeg=false;
const size=n=>n>=1e6?(n/1e6).toFixed(2)+' MB':(n/1e3).toFixed(1)+' KB';
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
async function api(route,data){const response=await fetch('/api/'+route,{method:data===undefined?'GET':'POST',headers:{'X-Publisher-Token':token,...(data===undefined?{}:{'Content-Type':'application/json'})},...(data===undefined?{}:{body:JSON.stringify(data)})});const result=await response.json();if(!response.ok)throw Error(result.error);return result}
async function job(fn){if(working)return;working=true;syncButtons();document.querySelector('main').setAttribute('aria-busy','true');try{await fn()}catch(e){message(e.message,true)}finally{working=false;document.querySelector('main').removeAttribute('aria-busy');syncButtons()}}
function syncButtons(){
  document.querySelectorAll('button,input,select').forEach(control=>{control.disabled=working||control.dataset.blocked==='true'});
  for(const id of ['save','analyze','selectVisible','clearVisible'])$(id).disabled=working||!scanned;
  $('prepare').disabled=working||!plan||plan.errors.length>0||[...document.querySelectorAll('.approve')].some(c=>!c.checked);
  $('apply').disabled=working||!stage;
}
function invalidate(){plan=null;stage=null;$('staged').hidden=true;$('preview').textContent='';$('review').replaceChildren(el('div','选择或策略已变化，请重新分析。','empty'));syncButtons()}
function changed(){selectionDirty=true;invalidate()}
function visible(){const q=$('search').value.toLowerCase(),folder=$('folder').value;return notes.filter(n=>(!q||(n.title+' '+n.path).toLowerCase().includes(q))&&(!folder||(folder==='__root__'?!n.path.includes('/'):n.path.startsWith(folder+'/')))&&(!$('only').checked||selected.has(n.path))&&(!$('candidate').checked||n.candidate))}
function render(){const list=visible();$('notes').replaceChildren();$('count').textContent=`共 ${notes.length} 篇 · 当前 ${list.length} 篇 · 已选择 ${selected.size} 篇${selectionDirty?' · 选择未保存':''}`;if(!list.length)$('notes').append(el('div',notes.length?'没有符合筛选条件的笔记。':'没有可管理的 Markdown 笔记。','empty'));for(const n of list){const row=el('label',undefined,'note'),check=el('input');check.type='checkbox';check.checked=selected.has(n.path);check.dataset.blocked=String(n.blocked&&!selected.has(n.path));check.setAttribute('aria-label','选择 '+n.title);check.onchange=()=>{check.checked?selected.add(n.path):selected.delete(n.path);changed();render()};const text=el('div');text.append(el('strong',n.title),el('span',n.blocked?'禁止生成':n.status,'badge'),el('small',n.path));if(n.error)text.append(el('small',n.error,'error-text'));row.append(check,text);$('notes').append(row)}syncButtons()}
async function scan(preserve=false){const pending=preserve&&selectionDirty?[...selected].map(p=>({path:p,id:notes.find(n=>n.path===p)?.id})):null;const pendingModes={...assetModes};const r=await api('scan');notes=r.notes;selected=new Set(pending?pending.map(p=>notes.find(n=>n.id===p.id)?.path||p.path):r.selected);assetModes=pending?{...r.assets,...pendingModes}:r.assets;ffmpeg=r.ffmpeg;scanned=true;selectionDirty=!!pending;showMissing([...selected].filter(p=>!notes.some(n=>n.path===p)));const folder=$('folder').value;$('folder').replaceChildren(new Option('全部目录',''));if(notes.some(n=>!n.path.includes('/')))$('folder').add(new Option('笔记库根目录','__root__'));[...new Set(notes.filter(n=>n.path.includes('/')).map(n=>n.path.split('/')[0]))].sort().forEach(f=>$('folder').add(new Option(f,f)));$('folder').value=[...$('folder').options].some(o=>o.value===folder)?folder:'';render();message(`扫描完成：${notes.length} 篇可管理笔记，已选择 ${selected.size} 篇。${pending?'未保存的选择已保留。':''}${r.ffmpeg?'视频转换工具已就绪。':'视频转码工具不可用，可保留原件。'}`)}
function showMissing(paths){$('missing').replaceChildren();for(const old of paths){const row=el('div',undefined,'message error');row.append(el('p','已选文件找不到：'+old));const select=el('select');select.setAttribute('aria-label','选择移动后的文件');select.add(new Option('选择移动后的笔记…',''));notes.filter(n=>!n.blocked).forEach(n=>select.add(new Option(n.path,n.path)));const link=el('button','关联并保留旧网址');link.onclick=()=>job(async()=>{if(!select.value)throw Error('先选择新的文件位置');await api('relink',{oldPath:old,newPath:select.value});invalidate();await scan(true)});const remove=el('button','取消此选择');remove.onclick=()=>{selected.delete(old);row.remove();changed();render()};row.append(select,link,remove);$('missing').append(row)}}
async function save(){await api('select',{selected:[...selected],assets:assetModes});selectionDirty=false;render()}
function showPlan(){const box=$('review');box.replaceChildren();for(const [key,title]of [['added','新增'],['updated','修改'],['removed','撤回']]){box.append(el('h3',title+' · '+plan.changes[key].length));plan.changes[key].forEach(t=>box.append(el('div',t,'change')))}if(plan.errors.length){box.append(el('h3','需要处理的问题'));plan.errors.forEach(e=>box.append(el('p',e.path+'：'+e.message,'error-text')))}if(plan.warnings.length){const d=el('details');d.append(el('summary','提示 · '+plan.warnings.length));plan.warnings.forEach(w=>d.append(el('p',w,'warning')));box.append(d)}box.append(el('h3',`附件 · ${plan.assets.length} 项 · 原始 ${size(plan.assets.reduce((s,a)=>s+a.bytes,0))}`));if(!plan.assets.length)box.append(el('p','本次没有本地附件。'));for(const a of plan.assets){const row=el('div',undefined,'asset'),c=el('input');c.type='checkbox';c.className='approve';c.dataset.key=a.key;c.setAttribute('aria-label','确认附件 '+a.path);c.onchange=()=>{stage=null;$('staged').hidden=true;syncButtons()};const info=el('div');info.append(el('strong',a.path),el('small',size(a.bytes)+' · 被 '+a.referencedBy.length+' 篇笔记引用'));const mode=el('select');mode.setAttribute('aria-label','压缩策略 '+a.path);for(const[v,t]of [['lossless','无损优先（截图推荐）'],['optimized','优化体积（照片／插画）'],['original','保留原件'],['video','MP4 浏览版（视频／GIF）']]){const option=new Option(t,v);option.disabled=v==='video'&&(!ffmpeg||!['.mp4','.webm','.mov','.m4v','.gif'].includes(a.ext));mode.add(option)}mode.value=a.mode;mode.onchange=()=>{for(const p of a.sources)assetModes[p]=mode.value;changed();message('策略已改变，重新分析后审核附件。')};info.append(mode);if(['.png','.jpg','.jpeg','.gif','.webp','.avif'].includes(a.ext)){const view=el('button','预览图片');view.style.marginLeft='8px';view.onclick=()=>job(async()=>{const r=await fetch('/api/thumbnail?id='+encodeURIComponent(plan.id)+'&key='+encodeURIComponent(a.key),{headers:{'X-Publisher-Token':token}});if(!r.ok)throw Error('预览加载失败');const image=el('img');image.alt=a.path;image.style.cssText='display:block;max-width:100%;max-height:250px;margin-top:12px';const objectUrl=URL.createObjectURL(await r.blob());image.src=objectUrl;image.onload=()=>URL.revokeObjectURL(objectUrl);info.append(image);view.remove()});info.append(view)}row.append(c,info);box.append(row)}syncButtons()}
$('rescan').onclick=()=>job(async()=>{invalidate();await scan(true)});['search','folder','only','candidate'].forEach(id=>$(id).addEventListener('input',render));$('selectVisible').onclick=()=>{visible().filter(n=>!n.blocked).forEach(n=>selected.add(n.path));changed();render()};$('clearVisible').onclick=()=>{visible().forEach(n=>selected.delete(n.path));changed();render()};$('save').onclick=()=>job(async()=>{await save();message('选择已保存，尚未生成网站副本。')});$('analyze').onclick=()=>job(async()=>{invalidate();await save();message('正在检查正文与引用…');plan=await api('analyze',{});showPlan();message(plan.errors.length?'分析发现问题，请修正后重新分析。':'分析完成，请逐项审核附件，再生成待预览副本。',plan.errors.length>0)});
$('prepare').onclick=()=>job(async()=>{message('正在生成媒体和正文副本，大视频可能需要几分钟…');stage=await api('prepare',{id:plan.id,approved:[...document.querySelectorAll('.approve:checked')].map(c=>c.dataset.key)});const before=stage.assets.reduce((s,a)=>s+a.originalBytes,0),after=stage.assets.reduce((s,a)=>s+a.bytes,0);message(`待预览副本已生成：${stage.notes.length} 篇，媒体 ${size(before)} → ${size(after)}。尚未写入网站。`);$('staged').hidden=!stage.notes.length;$('previewNote').replaceChildren();stage.notes.forEach(n=>$('previewNote').add(new Option(n.title,n.slug)));if(stage.notes.length)await preview()});
async function preview(){const r=await api('stage?id='+encodeURIComponent(stage.id)+'&slug='+encodeURIComponent($('previewNote').value));$('preview').textContent=r.markdown}$('previewNote').onchange=()=>job(preview);
$('apply').onclick=()=>job(async()=>{if(!confirm(`确认写入 ${stage.notes.length} 篇本地网站副本？\n撤回 ${stage.changes.removed.length} 篇。\n原笔记不变，不执行上传。`))return;message('正在校验构建并更新本地网站与搜索索引…');const r=await api('apply',{id:stage.id});invalidate();$('review').replaceChildren(el('div','本地网站已更新。修改选择后可再次分析。','empty'));await scan();message(r.message)});job(scan);
</script></body></html>
